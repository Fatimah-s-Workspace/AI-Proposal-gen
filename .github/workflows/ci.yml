name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tenderflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/tenderflow_ci?schema=public"
      AUTH_SECRET: "ci-test-secret-do-not-use-in-production"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      UPLOAD_DIR: "./uploads"
      EXPORT_DIR: "./exports"
      MAX_UPLOAD_MB: "15"
      GEMINI_API_KEY: ""
      GEMINI_MODEL: "gemini-3.5-flash"
      UPSTASH_REDIS_REST_URL: ""
      UPSTASH_REDIS_REST_TOKEN: ""
      SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      SENTRY_DSN: ""
      NEXT_PUBLIC_SENTRY_DSN: ""
      SENTRY_ORG: ""
      SENTRY_PROJECT: ""
      SENTRY_AUTH_TOKEN: ""
      BREVO_API_KEY: ""
      EMAIL_FROM: "TenderFlow AI <no-reply@example.com>"
      PAYSTACK_SECRET_KEY: ""
      PRO_PLAN_PRICE_NGN: "5000"
      CRON_SECRET: "ci-test-cron-secret"
      ALERT_EMAIL: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      # Integration tests hit real HTTP routes (auth, billing, uploads)
      # against an actually-running server and a real Postgres database -
      # NextAuth v4's CJS/ESM interop only works correctly when Next's own
      # bundler processes it, so these can't be unit-tested via direct
      # import. Reuses the build from the step above (SKIP_INTEGRATION_BUILD)
      # instead of building a second time.
      - name: Integration test
        run: npm run test:integration
        env:
          SKIP_INTEGRATION_BUILD: "1"
